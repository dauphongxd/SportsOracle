<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="15" fill="url(#grad1)" />
  
  <!-- Abstract Eye / Ball Icon -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="url(#grad2)" stroke-width="4" opacity="0.3"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="url(#grad2)" stroke-width="6" opacity="0.6"/>
  <circle cx="100" cy="100" r="30" fill="url(#grad2)" />
  
  <!-- Text -->
  <text x="200" y="115" font-family="Arial, sans-serif" font-size="65" font-weight="bold" fill="white">
    SPORTS <tspan fill="url(#grad2)">ORACLE</tspan>
  </text>
  
  <!-- Subtext -->
  <text x="205" y="155" font-family="Arial, sans-serif" font-size="20" fill="#cccccc" letter-spacing="2">
    AI-POWERED PREDICTION ENGINE
  </text>
</svg>
